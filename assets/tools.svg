<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" stroke="#e8e8e6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ilustração original: navalha, tesoura e pente em traço fino -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e8e8e6" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>

  <!-- Navalha -->
  <g transform="translate(120 140) rotate(-28)" stroke-width="2">
    <path d="M0 40 L300 40 Q330 40 336 62 L338 74 Q300 86 0 86 Z"/>
    <path d="M0 86 L300 86 Q330 80 338 74" fill="url(#hatch)"/>
    <path d="M10 52 L290 52" opacity=".5"/>
    <circle cx="20" cy="63" r="6"/>
    <path d="M20 63 C-40 70 -120 82 -230 66 Q-250 62 -244 50 Q-236 42 -210 44 C-120 50 -40 52 14 54" />
    <path d="M-200 50 C-120 56 -50 58 10 58" opacity=".5"/>
    <path d="M-160 56 l4 -4 m10 4 l4 -4 m10 4 l4 -4 m10 4 l4 -4" opacity=".6"/>
  </g>

  <!-- Tesoura -->
  <g transform="translate(470 330) rotate(18)" stroke-width="2">
    <ellipse cx="-40" cy="210" rx="44" ry="30" transform="rotate(-20 -40 210)"/>
    <ellipse cx="-40" cy="210" rx="30" ry="18" transform="rotate(-20 -40 210)" opacity=".6"/>
    <ellipse cx="70" cy="226" rx="44" ry="30" transform="rotate(25 70 226)"/>
    <ellipse cx="70" cy="226" rx="30" ry="18" transform="rotate(25 70 226)" opacity=".6"/>
    <path d="M110 250 q24 18 8 34" />
    <path d="M-6 186 L40 110 L66 -110 Q70 -128 58 -116 L18 100 Z" fill="url(#hatch)"/>
    <path d="M44 196 L10 110 L-26 -100 Q-30 -118 -18 -106 L34 104 Z"/>
    <circle cx="26" cy="112" r="7"/>
    <circle cx="26" cy="112" r="2.5"/>
  </g>

  <!-- Pente -->
  <g transform="translate(150 560) rotate(-8)" stroke-width="2">
    <rect x="0" y="0" width="340" height="44" rx="6"/>
    <path d="M10 44 v58 M24 44 v58 M38 44 v58 M52 44 v58 M66 44 v58 M80 44 v58 M94 44 v58 M108 44 v58 M122 44 v58 M136 44 v58 M150 44 v58 M164 44 v58 M178 44 v40 M190 44 v40 M202 44 v40 M214 44 v40 M226 44 v40 M238 44 v40 M250 44 v40 M262 44 v40 M274 44 v40 M286 44 v40 M298 44 v40 M310 44 v40 M322 44 v40"/>
    <path d="M12 14 H328" opacity=".45"/>
  </g>

  <!-- Detalhes -->
  <g stroke-width="1.4" opacity=".55">
    <circle cx="640" cy="120" r="56"/>
    <circle cx="640" cy="120" r="44" stroke-dasharray="2 6"/>
    <path d="M70 380 h60 M100 350 v60"/>
    <path d="M660 680 h70 M695 645 v70"/>
  </g>
</svg>
